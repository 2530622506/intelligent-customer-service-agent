services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: customer_service
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d customer_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "25672:5672"
      - "25673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd
      --advertise-client-urls=http://milvus-etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - milvus-etcd-data:/etcd

  milvus:
    image: milvusdb/milvus:v2.5.21
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      # RustFS 提供 S3-compatible 对象存储，同时保存业务原文件和 Milvus 后端对象。
      MINIO_ADDRESS: rustfs:9000
      MINIO_ACCESS_KEY: rustfsadmin
      MINIO_SECRET_KEY: rustfsadmin
      MINIO_ACCESS_KEY_ID: rustfsadmin
      MINIO_SECRET_ACCESS_KEY: rustfsadmin
      MINIO_USE_SSL: "false"
    ports:
      - "19530:19530"
      - "19091:9091"
    depends_on:
      milvus-etcd:
        condition: service_started
      rustfs:
        condition: service_healthy
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/change-me
    ports:
      - "17474:7474"
      - "17687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  rustfs:
    image: rustfs/rustfs:latest
    user: "0:0"
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_ACCESS_KEY_ID: rustfsadmin
      RUSTFS_SECRET_ACCESS_KEY: rustfsadmin
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - ./volumes/rustfs:/data/rustfs0
      - ./volumes/rustfs-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ../backend
    environment:
      APP_ENV: development
      READINESS_STRICT: "true"
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/customer_service
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MILVUS_URI: http://milvus:19530
      NEO4J_URI: bolt://neo4j:7687
      RUSTFS_ENDPOINT: http://rustfs:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      milvus:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ../frontend
    ports:
      - "55173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  milvus-etcd-data:
  milvus-data:
  neo4j-data:
  neo4j-logs:
